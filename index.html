<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gerador CPTM x TRIVIA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container py-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                Gerador CPTM x TRIVIA
            </h3>

        </div>

        <div class="card-body">

            <!-- BANCO DE DADOS -->

            <h5 class="mb-3">Banco de Dados</h5>

            <input
                type="file"
                id="banco"
                class="form-control mb-3"
                accept=".xlsx,.xls">

            <button
                id="btnBanco"
                class="btn btn-dark w-100 mb-4">

                Importar Banco de Dados

            </button>

            <hr>

            <!-- PDF -->

            <h5 class="mb-3">Controle de Apresentação</h5>

            <input
                type="file"
                id="pdf"
                class="form-control mb-3"
                accept=".pdf">

            <button
                id="btnPDF"
                class="btn btn-primary w-100 mb-4">

                Gerar Lista PDF

            </button>

            <hr>

            <!-- GESTÃO -->

            <h5 class="mb-3">Gestão de Escala</h5>

            <input
                type="file"
                id="excel"
                class="form-control mb-3"
                accept=".xlsx,.xls">

            <button
                id="btnExcel"
                class="btn btn-success w-100 mb-4">

                Carregar Gestão

            </button>

            <hr>

            <!-- CRUZAMENTO -->

            <button
                id="btnCruzar"
                class="btn btn-warning w-100 mb-4">

                Cruzar Dados

            </button>

<button
    id="btnPostos"
    class="btn btn-info w-100 mb-4">

    Gerar Postos

</button>
            
<label id="secaoResultado" class="fw-bold mb-2">
    Resultado
</label>

            <textarea
                id="resultado"
                class="form-control"
                rows="22"
                readonly></textarea>

            <div class="row mt-3">

                <div class="col-md-6 mb-2">

                    <button
                        id="copiar"
                        class="btn btn-success w-100">

                        Copiar

                    </button>

                </div>

                <div class="col-md-6 mb-2">

                    <button
                        id="limpar"
                        class="btn btn-secondary w-100">

                        Limpar

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="app.js"></script>

</body>

</html>
