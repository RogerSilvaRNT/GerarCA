<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Gerador CPTM x TRIVIA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="container-fluid vh-100">

<div class="row h-100">
<!-- MENU LATERAL -->

<div class="col-lg-3 col-xl-2 bg-white border-end p-3">

    <div class="card shadow-sm h-100">

        <div class="card-header bg-primary text-white text-center">

            <h5 class="mb-0">

                GERADOR
                <br>
                CPTM x TRIVIA

            </h5>

        </div>

        <div class="card-body d-grid gap-2">

            <!-- Arquivos ocultos -->

            <input
                type="file"
                id="banco"
                accept=".xlsx,.xls"
                hidden>

            <input
                type="file"
                id="pdf"
                accept=".pdf"
                hidden>

            <input
                type="file"
                id="excel"
                accept=".xlsx,.xls"
                hidden>

            <small class="text-secondary fw-bold">

                BANCO DE DADOS

            </small>

            <button
                id="btnBanco"
                class="btn btn-dark">

                Atualizar Banco

            </button>

            <hr>

            <small class="text-secondary fw-bold">

                CONTROLE DE APRESENTAÇÃO

            </small>

            <button
                id="btnPDF"
                class="btn btn-primary">

                Carregar PDF

            </button>

            <hr>

            <small class="text-secondary fw-bold">

                GESTÃO DE ESCALA

            </small>

            <button
                id="btnExcel"
                class="btn btn-success">

                Carregar Gestão

            </button>

            <hr>

            <small class="text-secondary fw-bold">

                PROCESSAMENTO

            </small>

            <button
                id="btnCruzar"
                class="btn btn-warning">

                Cruzar Dados

            </button>

            <button
                id="btnMonitoria"
                class="btn btn-secondary">

                Gerar Monitoria

            </button>

            <button
                id="btnPostos"
                class="btn btn-info">

                Gerar Postos

            </button>

            <button
                id="btnRendicoes"
                class="btn btn-danger">

                Gerar Rendições

            </button>

            <button
                id="btnExcelMonitoria"
                class="btn btn-dark">

                Exportar Excel

            </button>

            <hr>

            <div class="small">

                <div>

                    Banco:
                    <span id="statusBanco" class="fw-bold text-danger">

                        Não carregado

                    </span>

                </div>

                <div>

                    PDF:
                    <span id="statusPDF" class="fw-bold text-danger">

                        Não carregado

                    </span>

                </div>

                <div>

                    Gestão:
                    <span id="statusGestao" class="fw-bold text-danger">

                        Não carregada

                    </span>

                </div>

                <div>

                    Turno:
                    <span id="statusTurno" class="fw-bold">

                        --

                    </span>

                </div>

            </div>

        </div>

    </div>

</div>
<!-- =========================
PAINEL PRINCIPAL
========================= -->

<div class="col-lg-9 col-xl-10 d-flex flex-column p-3">

<div class="card shadow-sm mb-3">

<div class="card-header bg-primary text-white">

Resumo da Monitoria

</div>

<div class="card-body">

<div class="row text-center">

<div class="col">

<h6>Operadores TRIVIA</h6>

<h2 id="totalTrivia">

0

</h2>

</div>

<div class="col">

<h6>Maquinistas CPTM</h6>

<h2 id="totalCPTM">

0

</h2>

</div>

<div class="col">

<h6>Monitorias</h6>

<h2 id="totalMonitorias">

0

</h2>

</div>

<div class="col">

<h6>Sem Monitoria</h6>

<h2 id="semMonitoria">

0

</h2>

</div>

<div class="col">

<h6>Sem Operador</h6>

<h2 id="semOperador">

0

</h2>

</div>

</div>

</div>

</div>

<!-- =========================
RESULTADO
========================= -->

<div class="card shadow-sm flex-fill">

    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">

        <strong>

            Resultado

        </strong>

        <div>

            <button
                id="copiar"
                class="btn btn-success btn-sm me-2">

                Copiar

            </button>

            <button
                id="limpar"
                class="btn btn-danger btn-sm">

                Limpar

            </button>

        </div>

    </div>

    <div class="card-body p-2">

        <textarea
            id="resultado"
            class="form-control h-100"
            readonly
            style="
                resize:none;
                border:none;
                font-family:Consolas, monospace;
                font-size:14px;
                white-space:pre;
                background:#ffffff;
            ">

        </textarea>

    </div> <!-- card-body -->

</div> <!-- card -->

</div> <!-- painel principal -->

</div> <!-- row -->

</div> <!-- container-fluid -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>

</body>
</html>
